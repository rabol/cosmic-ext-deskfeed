[package]
name = "cosmic-ext-deskfeed"
version = "0.1.0"
edition = "2024"
# libcosmic declares 1.93; our own code needs 1.91 (Duration::from_mins).
rust-version = "1.93"
authors = ["Steen Rabol <cosmic-ext-avd@rabol.dev>"]
license = "MIT"
description = "Your work desktops on COSMIC™, working with Azure Virtual Desktop and Windows 365"
repository = "https://github.com/rabol/cosmic-ext-deskfeed"
# An application, not a library on crates.io.
publish = false

[workspace]
members = ["signin", "lines", "testkit"]

[dependencies]
# Bounded line reading, shared with the sign-in helper (workspace crate).
bounded_lines = { package = "cosmic-ext-deskfeed-lines", path = "lines" }
# Already in the dependency tree through libcosmic (ADR 0003, ADR 0008).
base64 = "0.22"
dirs = "6"
ring = "0.17"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# Local time for labels (ADR 0003); already in the tree through libcosmic,
# which turns on the same features.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
libc = "0.2"
sha2 = "0.11"
url = "2.5"
# HTTP with TLS (ADR 0008): system trust store, ring provider, no bundled roots.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
tokio = { version = "1.48.0", features = ["full"] }
# Secret Service over D-Bus (ADR 0009); already in the tree through libcosmic.
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
# XSETTINGS (Xft/DPI) for the scale X11 windows get (ADR 0015); already in
# the tree through libcosmic's renderer, core protocol only.
x11rb = { version = "0.13", default-features = false }

[dev-dependencies]
# Random-input testing (ADR 0023); tests only.
testkit = { package = "cosmic-ext-deskfeed-testkit", path = "testkit" }
# Reading settings files the way cosmic-config does (`ron::from_str`), in
# tests only; the same version libcosmic already uses.
ron = "0.12"
# A mock HTTP server for tests (ADR 0003: compared with wiremock and
# httpmock); tests only.
mockito = "1"
# Temporary folders for tests, removed even when a test fails (ADR 0003);
# already in the tree through cosmic-config.
tempfile = "3"

[build-dependencies]
xdgen = "0.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# Pinned to a reviewed revision (spec §2, docs/adr/0002-pin-libcosmic-revision.md).
# To update: change rev, run `cargo update -p libcosmic`, rebuild, and record it in the ADR.
rev = "e1f2cd2e52226aa50d59bb2cd6d43ffe290106ed"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# Remove features if not needed.
features = [
    # About widget for the app
    "about",
    # Not "single-instance": its D-Bus path breaks on the "-" in the app ID
    # and the app exits at start; src/single.rs does it instead.
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal",
    # Closing and reopening the main window while the app keeps running
    # (background operation, ADR 0017)
    "multi-window",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
