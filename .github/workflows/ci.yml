# Checks on every push to main and every pull request (spec §11).
#
# Runs in an Arch Linux container, the distribution the app is packaged for
# (packaging/aur). The sign-in helper needs GTK >= 4.10 and WebKitGTK >= 2.42
# (signin/Cargo.toml, ADR 0007 addendum).
# Rust is the release in rust-toolchain.toml, through rustup; rust-analyzer
# is a pinned release (what editors run), checked by its SHA-256 (ADR 0025).
# Third-party actions are pinned to a commit; the job can only read the
# repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test, build, validate
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build and check tools
        run: >
          pacman -Syu --noconfirm --needed
          git rustup just pkgconf
          gtk4 webkitgtk-6.0 libxkbcommon wayland
          desktop-file-utils appstream
          dbus cargo-deny

      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (pedantic, no warnings allowed)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -W clippy::pedantic

      - name: Tests
        run: cargo test --locked --workspace

      - name: Dependencies (advisories, licenses, sources; deny.toml)
        run: cargo deny --locked check

      - name: rust-analyzer (what editors report)
        env:
          # Release 2026-10-19 (0.3.3089-standalone). To update: change both.
          RA_URL: https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-19/rust-analyzer-x86_64-unknown-linux-gnu.gz
          RA_SHA256: 8fde1c9dae81459f98e99eedae3654846a9166abea686306c26e57773be558da
        run: |
          curl -sSfL -o /tmp/ra.gz "$RA_URL"
          echo "$RA_SHA256  /tmp/ra.gz" | sha256sum -c -
          gunzip /tmp/ra.gz && chmod +x /tmp/ra
          /tmp/ra diagnostics .

      - name: Release build
        run: cargo build --locked --release --workspace

      - name: Desktop entry and AppStream metadata
        run: |
          desktop-file-validate target/xdgen/app.desktop
          appstreamcli validate --no-net target/xdgen/app.metainfo.xml
