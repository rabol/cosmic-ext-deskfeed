# Release packages (ADR 0030): on a pushed tag `v<version>`, a source
# archive with every crate in vendor/, an .rpm (Fedora 43), a .deb (Debian
# testing) and an Arch package, each installed in a fresh container of its
# distribution and checked with `cosmic-ext-deskfeed --check`; then a draft
# GitHub release for the owner to read over and publish.
#
# Run by hand (Actions → Release → Run workflow) it builds and checks the
# packages, keeps them as the run's artifacts, and makes no release.
#
# Third-party actions are pinned to a commit. Only the release job can
# write to the repository.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Source archive (vendored)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Version (the same in every file; the tag's on a tag)
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -I scripts/set-version.py --check)
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "tag $REF_NAME doesn't match version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Archive with vendored crates
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="cosmic-ext-deskfeed-$VERSION"
          mkdir -p /tmp/src
          git archive --prefix="$name/" HEAD | tar -x -C /tmp/src
          cd "/tmp/src/$name"
          rustup toolchain install
          mkdir -p .cargo
          # Versioned folder names: zbus-lockstep (in atspi-common) also
          # reads ../xml, which unversioned would be the xml crate's folder
          # ("File has no extension"; zbus-lockstep 0.5.2 `resolve_xml_path`).
          cargo vendor --locked --versioned-dirs vendor > .cargo/config.toml
          cd /tmp/src
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "$GITHUB_WORKSPACE/$name.tar.gz" "$name"

      - name: Keep it
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source
          path: cosmic-ext-deskfeed-*.tar.gz
          if-no-files-found: error

  rpm:
    name: .rpm (Fedora 43)
    needs: source
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - name: Source archive
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source

      - name: Build tools and dependencies (from the spec)
        run: |
          tar -xzf "cosmic-ext-deskfeed-$VERSION.tar.gz" \
            "cosmic-ext-deskfeed-$VERSION/packaging/rpm/cosmic-ext-deskfeed.spec"
          cp "cosmic-ext-deskfeed-$VERSION/packaging/rpm/cosmic-ext-deskfeed.spec" .
          dnf -y install rpm-build dnf-plugins-core
          dnf -y builddep cosmic-ext-deskfeed.spec
          rustc --version

      - name: Build
        run: |
          mkdir -p rpmbuild/SOURCES
          cp "cosmic-ext-deskfeed-$VERSION.tar.gz" rpmbuild/SOURCES/
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" cosmic-ext-deskfeed.spec
          cp rpmbuild/RPMS/x86_64/*.rpm .

      - name: Keep it
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rpm
          path: "*.rpm"
          if-no-files-found: error

  deb:
    name: .deb (Debian testing)
    needs: source
    runs-on: ubuntu-latest
    container:
      image: debian:testing
    env:
      VERSION: ${{ needs.source.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Source archive
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source

      - name: Build tools and dependencies (from debian/control)
        run: |
          tar -xzf "cosmic-ext-deskfeed-$VERSION.tar.gz"
          cp -r "cosmic-ext-deskfeed-$VERSION/packaging/debian" "cosmic-ext-deskfeed-$VERSION/debian"
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts equivs
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' \
            "cosmic-ext-deskfeed-$VERSION/debian/control"
          rustc --version

      - name: Build
        run: |
          cd "cosmic-ext-deskfeed-$VERSION"
          dpkg-buildpackage -b -us -uc
          cp ../cosmic-ext-deskfeed_*.deb "$GITHUB_WORKSPACE/"

      - name: Keep it
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deb
          path: "*.deb"
          if-no-files-found: error

  arch:
    name: Arch package
    needs: source
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - name: Source archive
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source

      - name: Build user (makepkg doesn't run as root)
        run: |
          pacman -Syu --noconfirm --needed git rustup
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir build
          tar -xzf "cosmic-ext-deskfeed-$VERSION.tar.gz" \
            "cosmic-ext-deskfeed-$VERSION/packaging/aur/cosmic-ext-deskfeed/PKGBUILD"
          cp "cosmic-ext-deskfeed-$VERSION/packaging/aur/cosmic-ext-deskfeed/PKGBUILD" build/
          # makepkg uses a source file that's already there instead of
          # downloading the tag's archive.
          cp "cosmic-ext-deskfeed-$VERSION.tar.gz" build/
          chown -R builder build

      - name: Build (with the PKGBUILD's tests)
        run: |
          cd build
          sudo -u builder rustup default stable
          sudo -u builder makepkg --syncdeps --noconfirm
          cp cosmic-ext-deskfeed-*.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - name: Keep it
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arch
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  install:
    name: Install and check (${{ matrix.name }})
    needs: [rpm, deb, arch]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 43
            image: fedora:43
            artifact: rpm
            install: dnf -y install ./*.rpm
          - name: Fedora 44
            image: fedora:44
            artifact: rpm
            install: dnf -y install ./*.rpm
          - name: Debian testing
            image: debian:testing
            artifact: deb
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./*.deb
          - name: Arch
            image: archlinux:base
            artifact: arch
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./*.pkg.tar.zst
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Package
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.artifact }}

      - name: Install it with its dependencies
        run: ${{ matrix.install }}

      - name: Dependency check (FreeRDP 3.32.2+ with Entra, sign-in helper)
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          cosmic-ext-deskfeed --check

  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [source, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - name: Check out (for the changelog)
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Packages
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and notes
        run: |
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS && cd ..
          # The version's section of CHANGELOG.md.
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on' \
            CHANGELOG.md > notes.md
          test -s notes.md

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "Deskfeed $VERSION" --notes-file notes.md dist/*
