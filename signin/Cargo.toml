[package]
name = "cosmic-ext-deskfeed-signin"
version = "0.1.0"
edition = "2024"
# libcosmic declares 1.93; our own code needs 1.91 (Duration::from_mins).
rust-version = "1.93"
authors = ["Steen Rabol <cosmic-ext-avd@rabol.dev>"]
license = "MIT"
description = "Sign-in-only web view helper for Deskfeed (see docs/adr/0007-sign-in-web-view.md)"
repository = "https://github.com/rabol/cosmic-ext-deskfeed"
publish = false

[dependencies]
common = { package = "cosmic-ext-deskfeed-common", path = "../common" }
# Only this helper links GTK and WebKit (ADR 0007). The features are the
# oldest versions whose APIs the helper uses: GTK 4.10, WebKitGTK 2.42.
# The packages require at least these (packaging/).
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
webkit6 = { version = "0.6", features = ["v2_42"] }
serde = { version = "1", features = ["derive"] }
# A bounded queue from a reader thread to the main loop, awaited instead of
# polled (ADR 0003); all three already come with glib.
futures-channel = "0.3"
futures-executor = "0.3"
futures-util = "0.3"
serde_json = "1"
url = "2.5"

[dev-dependencies]
# The shared crate's random-input tool (ADR 0023), for tests only.
common = { package = "cosmic-ext-deskfeed-common", path = "../common", features = ["testkit"] }
# Temporary folders for tests (ADR 0003); already in the tree.
tempfile = "3"
